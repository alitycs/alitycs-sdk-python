name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.12"
      - name: Verify governance policy
        run: |
          ./scripts/verify-workflow-pins.rb
          ./scripts/test-coderabbit-policy.rb
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Validate CodeRabbit configuration
        run: ./scripts/validate-coderabbit.sh
      - name: Install development tooling
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint, test, verify coverage, and build
        run: |
          python -m ruff check src tests scripts/e2e_run.py
          python -m pytest --cov=alitycs --cov-branch --cov-report=json --cov-fail-under=90
          python scripts/coverage_gate.py
          python -m build

  compatibility:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9.25", "3.14.7"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install and test
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest
