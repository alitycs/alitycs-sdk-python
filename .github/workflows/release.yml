name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build release artifacts
    if: github.repository == 'alitycs/alitycs-sdk-python'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag_commit: ${{ steps.verify_tag.outputs.tag_commit }}
      tag_object: ${{ steps.verify_tag.outputs.tag_object }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag targets reviewed main history
        id: verify_tag
        shell: bash
        run: |
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "error: releases require an annotated tag" >&2
            exit 1
          fi
          tag_object="$(git rev-parse "${GITHUB_REF}^{tag}")"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$GITHUB_REF_NAME" == "v${version}" ]]
          PYTHONPATH=src python -c \
            'import alitycs, alitycs.client; assert alitycs.__version__ == alitycs.client.__version__ == "'"$version"'"'
          printf 'tag_commit=%s\ntag_object=%s\n' "$tag_commit" "$tag_object" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Install development tooling
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify and build release
        run: |
          python -m ruff check src tests scripts/e2e_run.py
          python -m pytest --cov=alitycs --cov-branch --cov-report=json --cov-fail-under=90
          python scripts/coverage_gate.py
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          python -c 'import alitycs'
      - name: Prepare release artifacts
        run: |
          cp -R dist release
          (cd release && sha256sum -- ./* > SHA256SUMS)
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Attest and publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release/
      - name: Verify artifact checksums
        run: (cd release && sha256sum --check --strict SHA256SUMS)
      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.build.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{tag}")" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" == "$EXPECTED_TAG_COMMIT" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_TAG_COMMIT" ]]
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_COMMIT: ${{ needs.build.outputs.tag_commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{tag}")" == "$EXPECTED_TAG_OBJECT" ]]
          [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" == "$EXPECTED_TAG_COMMIT" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_TAG_COMMIT" ]]
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes

  publish-pypi:
    name: Publish to PyPI
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/alitycs
    permissions:
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist/
      - name: Verify artifact checksums
        run: (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Remove checksum manifest
        run: rm dist/SHA256SUMS
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
